<section class="section section--story" id="our-journey">
  <span class="section__eyebrow">القسم الثاني</span>
  <h2 class="section__title">رحلتنا</h2>
  <div class="golden-line"></div>

  <div class="timeline">
    <div class="timeline__item">
      <span class="timeline__marker"></span>
      <div class="timeline__card glass">
        <span class="timeline__date">{{DATE_01}}</span>
        <img class="timeline__photo" src="assets/images/{{PHOTO_01}}" alt="{{MEMORY_01_ALT}}">
        <h3 class="timeline__title">{{MILESTONE_01_TITLE}}</h3>
        <p class="timeline__text">{{MEMORY_01}}</p>
      </div>
    </div>

    <div class="timeline__item">
      <span class="timeline__marker"></span>
      <div class="timeline__card glass">
        <span class="timeline__date">{{DATE_02}}</span>
        <img class="timeline__photo" src="assets/images/{{PHOTO_02}}" alt="{{MEMORY_02_ALT}}">
        <h3 class="timeline__title">{{MILESTONE_02_TITLE}}</h3>
        <p class="timeline__text">{{MEMORY_02}}</p>
      </div>
    </div>

    <div class="timeline__item">
      <span class="timeline__marker"></span>
      <div class="timeline__card glass">
        <span class="timeline__date">{{DATE_03}}</span>
        <img class="timeline__photo" src="assets/images/{{PHOTO_03}}" alt="{{MEMORY_03_ALT}}">
        <h3 class="timeline__title">{{MILESTONE_03_TITLE}}</h3>
        <p class="timeline__text">{{MEMORY_03}}</p>
      </div>
    </div>

    <div class="timeline__item">
      <span class="timeline__marker"></span>
      <div class="timeline__card glass">
        <span class="timeline__date">{{DATE_04}}</span>
        <img class="timeline__photo" src="assets/images/{{PHOTO_04}}" alt="{{MEMORY_04_ALT}}">
        <h3 class="timeline__title">{{MILESTONE_04_TITLE}}</h3>
        <p class="timeline__text">{{MEMORY_04}}</p>
      </div>
    </div>

    <!-- Duplicate a .timeline__item block above for each additional milestone -->
  </div>
</section>

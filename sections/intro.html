<section class="section section--intro" id="beginning">
  <span class="section__eyebrow">القسم الأول</span>
  <h2 class="section__title ink-reveal" data-reveal>البداية</h2>
  <div class="golden-line" data-reveal></div>

  <div class="intro-grid" data-reveal>
    <article class="glass intro-card">
      <h3 class="intro-card__label">أول رسالة</h3>
      <p class="intro-card__text">{{FIRST_MESSAGE}}</p>
    </article>

    <article class="glass intro-card">
      <h3 class="intro-card__label">أول لقاء</h3>
      <p class="intro-card__text">{{FIRST_MEETING}}</p>
    </article>

    <article class="glass intro-card">
      <h3 class="intro-card__label">أول ضحكة</h3>
      <p class="intro-card__text">{{FIRST_LAUGH}}</p>
    </article>

    <article class="glass intro-card">
      <h3 class="intro-card__label">أول هزار</h3>
      <p class="intro-card__text">{{FIRST_JOKE}}</p>
    </article>

    <article class="glass intro-card">
      <h3 class="intro-card__label">أول إعجاب</h3>
      <p class="intro-card__text">{{FIRST_ADMIRATION}}</p>
    </article>

    <article class="glass intro-card">
      <h3 class="intro-card__label">أول اعتراف</h3>
      <p class="intro-card__text">{{FIRST_CONFESSION}}</p>
    </article>
  </div>

  <p class="name-signature ink-reveal" data-reveal>{{HER_NAME}}</p>
</section>

<section class="section section--gallery" id="gallery">
  <span class="section__eyebrow">القسم السادس</span>
  <h2 class="section__title">المعرض</h2>
  <div class="golden-line"></div>

  <div class="gallery-grid" data-reveal>
    <div class="gallery-item"><img src="assets/images/{{GALLERY_PHOTO_01}}" loading="lazy" alt="{{GALLERY_CAPTION_01}}"><span class="gallery-item__caption">{{GALLERY_CAPTION_01}}</span></div>
    <div class="gallery-item"><img src="assets/images/{{GALLERY_PHOTO_02}}" loading="lazy" alt="{{GALLERY_CAPTION_02}}"><span class="gallery-item__caption">{{GALLERY_CAPTION_02}}</span></div>
    <div class="gallery-item"><img src="assets/images/{{GALLERY_PHOTO_03}}" loading="lazy" alt="{{GALLERY_CAPTION_03}}"><span class="gallery-item__caption">{{GALLERY_CAPTION_03}}</span></div>
    <div class="gallery-item"><img src="assets/images/{{GALLERY_PHOTO_04}}" loading="lazy" alt="{{GALLERY_CAPTION_04}}"><span class="gallery-item__caption">{{GALLERY_CAPTION_04}}</span></div>
    <div class="gallery-item"><img src="assets/images/{{GALLERY_PHOTO_05}}" loading="lazy" alt="{{GALLERY_CAPTION_05}}"><span class="gallery-item__caption">{{GALLERY_CAPTION_05}}</span></div>
    <div class="gallery-item"><img src="assets/images/{{GALLERY_PHOTO_06}}" loading="lazy" alt="{{GALLERY_CAPTION_06}}"><span class="gallery-item__caption">{{GALLERY_CAPTION_06}}</span></div>
  </div>

  <div class="lightbox">
    <button class="lightbox__close" aria-label="إغلاق">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="الصورة السابقة">›</button>
    <img class="lightbox__img" src="" alt="">
    <button class="lightbox__nav lightbox__nav--next" aria-label="الصورة التالية">‹</button>
  </div>
</section>

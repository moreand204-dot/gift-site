<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{HER_NAME}} — هدية إلى زوجتي المستقبلية</title>
<meta name="description" content="رحلة تفاعلية كُتبت بالحب لـ {{HER_NAME}}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Lemonada:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pages/gate.css">
<link rel="stylesheet" href="css/pages/intro.css">
<link rel="stylesheet" href="css/pages/chapters.css">
<link rel="stylesheet" href="css/pages/timeline.css">
<link rel="stylesheet" href="css/pages/gallery.css">
<link rel="stylesheet" href="css/pages/poems.css">
<link rel="stylesheet" href="css/pages/future.css">
<link rel="stylesheet" href="css/pages/moods.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ============ PASSWORD GATE ============ -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate__panel glass">
      <span class="gate__icon"><i data-lucide="lock"></i></span>
      <p class="gate__label">حطي كلمة السر</p>
      <input id="gate-input" class="gate__input" type="text" placeholder="حطي اسم أفضل شخص لقلبك..." autocomplete="off">
      <p id="gate-hint" class="gate__hint"></p>
      <button type="submit" class="btn-glow gate__submit">
        <i data-lucide="key-round"></i>
        دخول
      </button>
    </form>
  </div>

  <!-- ============ PRELOADER (cinematic opening) ============ -->
  <div id="preloader" class="preloader" hidden>
    <div class="preloader__stars"></div>
    <div class="preloader__fog"></div>
    <canvas id="pen-canvas" class="preloader__pen-canvas"></canvas>
    <div class="preloader__text-stack">
      <p class="pen-line" data-line="1">هدية إلى زوجتي المستقبلية</p>
      <p class="pen-line pen-line--name" data-line="2">{{HER_NAME}}</p>
      <p class="pen-line pen-line--nickname" data-line="3">{{NICKNAME}}</p>
      <p class="pen-line pen-line--quote" data-line="4">هذه ليست مجرد صفحات...<br>بل رحلة كاملة كتبتها بقلبي.</p>
    </div>
    <button id="start-journey" class="btn-glow preloader__cta" hidden>
      <i data-lucide="heart"></i>
      ابدئي الرحلة
    </button>
  </div>

  <!-- ============ CUSTOM CURSOR ============ -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- ============ AMBIENT LAYERS (persist across whole site) ============ -->
  <canvas id="particles-canvas" class="ambient-layer"></canvas>
  <div id="floating-hearts" class="ambient-layer"></div>
  <div id="golden-dust" class="ambient-layer"></div>

  <!-- ============ MUSIC TOGGLE ============ -->
  <button id="music-toggle" class="music-toggle" aria-label="تشغيل الموسيقى">
    <span class="music-toggle__bar"></span>
    <span class="music-toggle__bar"></span>
    <span class="music-toggle__bar"></span>
  </button>
  <audio id="bg-music" src="assets/music/{{BACKGROUND_MUSIC}}.mp3" loop preload="none"></audio>

  <!-- ============ SOUND EFFECTS (drop real files into assets/sfx/) ============ -->
  <audio id="sfx-heartbeat"  src="assets/sfx/heartbeat.mp3"  preload="none"></audio>
  <audio id="sfx-pen"        src="assets/sfx/pen-draw.mp3"   preload="none"></audio>
  <audio id="sfx-page-flip"  src="assets/sfx/page-flip.mp3"  preload="none"></audio>
  <audio id="sfx-gift-open"  src="assets/sfx/gift-open.mp3"  preload="none"></audio>
  <audio id="sfx-rose-fall"  src="assets/sfx/rose-fall.mp3"  preload="none"></audio>
  <audio id="sfx-rain"       src="assets/sfx/rain.mp3"       preload="none" loop></audio>
  <audio id="sfx-thunder"    src="assets/sfx/thunder.mp3"    preload="none"></audio>
  <audio id="sfx-whisper"    src="assets/sfx/whisper.mp3"    preload="none"></audio>
  <audio id="sfx-typing"     src="assets/sfx/typing.mp3"     preload="none"></audio>

  <!-- ============ MAIN SITE: one chapter visible at a time ============ -->
  <main id="site" class="site" hidden>
    <div class="chapters">
      <div class="chapter" id="chapter-beginning"></div>
      <div class="chapter" id="chapter-memories"></div>
      <div class="chapter" id="chapter-problems"></div>
      <div class="chapter" id="chapter-reconciliation"></div>
      <div class="chapter" id="chapter-laughter"></div>
      <div class="chapter" id="chapter-jokes"></div>
      <div class="chapter" id="chapter-teasing"></div>
      <div class="chapter" id="chapter-jealousy"></div>
      <div class="chapter" id="chapter-poetry-book"></div>
      <div class="chapter" id="chapter-poems"></div>
      <div class="chapter" id="chapter-letters"></div>
      <div class="chapter" id="chapter-dreams"></div>
      <div class="chapter" id="chapter-future"></div>
      <div class="chapter" id="chapter-ending"></div>
    </div>
  </main>

  <!-- Inter-chapter transition: fades to black, pen draws a random word -->
  <div id="chapter-transition" class="chapter-transition">
    <canvas id="chapter-pen-canvas" width="220" height="220" style="width:140px;height:140px;"></canvas>
    <p id="chapter-transition-word" class="chapter-transition__word"></p>
    <button id="chapter-transition-next" class="btn-glow chapter-transition__next" data-chapter-next>
      <i data-lucide="arrow-left"></i>
      جاهزة للقسم اللي بعده؟
    </button>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script src="js/gate.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/scroll.js"></script>
  <script src="js/chapters.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/book.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/music.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
